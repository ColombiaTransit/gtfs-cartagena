name: Fetch Mi Bus Transcaribe API snapshot

# One-off snapshot of the M2M Control API (docs/mibus-transcaribe-api.md),
# started by hand. No credentials, no schedule.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Dates for the departures (YYYY-MM-DD, space separated): a weekday, a Saturday, a Sunday, holidays"
        required: true
        default: "2026-12-02 2026-12-05 2026-12-06 2026-12-08"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch snapshot
        env:
          DATES: ${{ github.event.inputs.dates }}
        run: python scripts/fetch_m2m.py $DATES

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add raw/m2m/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Mi Bus Transcaribe API snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi
