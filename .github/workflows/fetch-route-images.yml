name: Fetch Transcaribe route maps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Download route maps
        run: python scripts/fetch_route_images.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add raw/web/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Transcaribe route maps ($(date -u +%Y-%m-%d))"
            git push
          fi
