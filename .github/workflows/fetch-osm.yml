name: Fetch OSM data from Overpass

# Uses the OVERPASS_URL secret (the interpreter endpoint of our own Overpass
# server). It must be a secret, not a variable: GitHub masks secrets in the
# log, but prints variables in plain text.

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "Parts to fetch (stops routes roads pois); empty = all"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests numpy

      - name: Export OSM data
        env:
          OVERPASS_URL: ${{ secrets.OVERPASS_URL }}
          PARTS: ${{ github.event.inputs.parts }}
        run: python scripts/fetch_osm.py $PARTS

      - name: Match stops again
        run: python scripts/match_stops.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add raw/osm/ data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update OSM export ($(date -u +%Y-%m-%d))"
            git push
          fi
