name: Running times with GraphHopper

# Routes every pair of consecutive stops of the API snapshot (raw/m2m/) with
# our GraphHopper server (organisation variable GRAPHHOPPER_URL, base URL
# without /route). Started by hand.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "GraphHopper profile"
        required: true
        default: "bus"
      variants:
        description: "Only these route variants (id_migracao, space separated); empty = all"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute running times
        env:
          GRAPHHOPPER_URL: ${{ vars.GRAPHHOPPER_URL }}
          PROFILE: ${{ github.event.inputs.profile }}
          VARIANTS: ${{ github.event.inputs.variants }}
        run: python scripts/running_times.py --profile "$PROFILE" $VARIANTS

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/running_times.csv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Running times from GraphHopper ($(date -u +%Y-%m-%d))"
            git push
          fi
